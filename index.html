
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マビノギモバイル MML BBS</title>
<style>
:root {
  color-scheme: dark;
  --bg: #120d1d;
  --panel: #20162e;
  --panel2: #2c2040;
  --text: #f5edff;
  --muted: #b9a9ca;
  --accent: #b58aff;
  --danger: #ff737e;
  --border: #49365e;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, sans-serif;
  line-height: 1.6;
}
main {
  width: min(920px, 100%);
  margin: auto;
  padding: 18px 14px 36px;
}
h1 { font-size: 1.55rem; line-height: 1.4; }
h2 { font-size: 1.2rem; }
h3 { overflow-wrap: anywhere; }
p { margin-top: 6px; }
.muted, .meta { color: var(--muted); font-size: .9rem; }
.panel, .post {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  margin: 14px 0;
}
label {
  display: block;
  margin: 12px 0 5px;
  font-weight: 600;
}
input, select, textarea, button {
  font: inherit;
}
input, select, textarea {
  width: 100%;
  padding: 11px;
  color: var(--text);
  background: #160f22;
  border: 1px solid var(--border);
  border-radius: 8px;
}
textarea {
  min-height: 100px;
  resize: vertical;
  font-family: monospace;
}
button {
  border: 0;
  border-radius: 8px;
  padding: 10px 14px;
  background: var(--accent);
  color: #211331;
  font-weight: 700;
  cursor: pointer;
  margin: 5px 4px 5px 0;
}
button.secondary {
  background: var(--panel2);
  border: 1px solid var(--border);
  color: var(--text);
}
button.danger {
  background: #662833;
  color: #fff;
  border: 1px solid #a94b5a;
}
button:disabled { opacity: .55; cursor: wait; }
.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.full { grid-column: 1 / -1; }
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 12px;
}
.posthead {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}
.posthead h3 { margin: 0; }
.tag {
  color: #e3d0ff;
  background: #44315e;
  border-radius: 20px;
  padding: 3px 10px;
  font-size: .8rem;
}
.partview {
  margin-top: 12px;
  border-top: 1px solid var(--border);
  padding-top: 10px;
}
summary { cursor: pointer; }
.mml {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  word-break: break-word;
  background: #130d1c;
  padding: 12px;
  border-radius: 8px;
  font-size: .9rem;
}
.status {
  padding: 10px 12px;
  border-radius: 8px;
  background: #282039;
  overflow-wrap: anywhere;
}
.admin-panel {
  border-color: #9770d4;
}
.admin-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.empty {
  padding: 24px 8px;
  text-align: center;
  color: var(--muted);
}
footer {
  margin-top: 30px;
  text-align: center;
  color: var(--muted);
  font-size: .85rem;
}
@media (max-width: 600px) {
  .grid { grid-template-columns: 1fr; }
  h1 { font-size: 1.35rem; }
  main { padding: 12px 10px 28px; }
}
</style>
</head>
<body>
<main>
<header>
  <h1>🎵 マビノギモバイル MML BBS</h1>
  <p class="muted">～上海かも美幻樂団～</p>
  <p>みんなのMMLを共有しよう！</p>
</header>

<div id="status" class="status" role="status">
  掲示板に接続しています…
</div>

<section class="panel">
  <h2>📝 MMLを投稿</h2>
  <form id="postForm">
    <div class="grid">
      <div>
        <label for="title">曲名 *</label>
        <input id="title" maxlength="100" required
          placeholder="曲名を入力">
      </div>
      <div>
        <label for="author">投稿者名</label>
        <input id="author" maxlength="50"
          placeholder="匿名でもOK">
      </div>
      <div class="full">
        <label for="genre">ジャンル *</label>
        <select id="genre" required>
          <option value="ゲーム音楽">ゲーム音楽</option>
          <option value="アニメ・特撮">アニメ・特撮</option>
          <option value="J-POP">J-POP</option>
          <option value="洋楽">洋楽</option>
          <option value="クラシック">クラシック</option>
          <option value="オリジナル">オリジナル</option>
          <option value="その他">その他</option>
        </select>
      </div>
      <div class="full">
        <label for="melody">メロディ</label>
        <textarea id="melody" spellcheck="false"
          placeholder="メロディのMML"></textarea>
      </div>
      <div class="full">
        <label for="chord1">和音１</label>
        <textarea id="chord1" spellcheck="false"
          placeholder="和音１のMML"></textarea>
      </div>
      <div class="full">
        <label for="chord2">和音２</label>
        <textarea id="chord2" spellcheck="false"
          placeholder="和音２のMML"></textarea>
      </div>
      <div class="full">
        <label for="deleteToken">削除用パスワード *</label>
        <input id="deleteToken" type="password"
          minlength="8" maxlength="200" required
          autocomplete="new-password"
          placeholder="8文字以上・忘れないように保管">
        <p class="muted">
          投稿者自身が後から削除するときに使います。
          管理者はこのパスワードなしでも削除できます。
        </p>
      </div>
      <div class="full">
        <button type="submit">投稿する</button>
      </div>
    </div>
  </form>
</section>

<section class="panel admin-panel">
  <div class="admin-title">
    <h2>🔐 管理者ページ</h2>
    <span id="adminState" class="muted">ログアウト中</span>
  </div>

  <p class="muted">
    管理者ログイン後、投稿ごとに削除できます。
    削除用パスワードを忘れた投稿も対象です。
  </p>

  <form id="adminLoginForm">
    <label for="adminPassword">管理者パスワード</label>
    <input id="adminPassword" type="password"
      autocomplete="current-password" required
      placeholder="管理者パスワードを入力">
    <div class="actions">
      <button id="adminLoginButton" type="submit">
        管理者ログイン
      </button>
      <button id="adminLogoutButton" type="button"
        class="secondary" hidden>
        ログアウト
      </button>
    </div>
  </form>

  <p id="adminMessage" class="muted" role="status"></p>
</section>

<section class="panel">
  <h2>📚 投稿一覧</h2>
  <label for="search">曲名・投稿者・MMLを検索</label>
  <input id="search" type="search" placeholder="検索ワード">

  <label for="filter">ジャンルで絞り込み</label>
  <select id="filter">
    <option value="">すべてのジャンル</option>
    <option value="ゲーム音楽">ゲーム音楽</option>
    <option value="アニメ・特撮">アニメ・特撮</option>
    <option value="J-POP">J-POP</option>
    <option value="洋楽">洋楽</option>
    <option value="クラシック">クラシック</option>
    <option value="オリジナル">オリジナル</option>
    <option value="その他">その他</option>
  </select>

  <div id="posts">
    <div class="empty">読み込み中…</div>
  </div>
</section>

<footer>
  マビノギモバイル MML BBS · ～上海かも美幻樂団～
</footer>
</main>

<script>
const SUPABASE_URL = "https://jljaukitpgsxeviqlody.supabase.co";
const SUPABASE_KEY = "sb_publishable_-08m3iSz0TuJT4x2QQ-C0g_aq6dSI3e";

const API = SUPABASE_URL + "/rest/v1/mml_posts";
const RPC = SUPABASE_URL + "/rest/v1/rpc/delete_mml_post";
const ADMIN_API = SUPABASE_URL + "/functions/v1/admin-delete-post";

let posts = [];
let adminPasswordForSession = null;

const $ = (id) => document.getElementById(id);

async function request(url, options = {}) {
  const headers = {
    apikey: SUPABASE_KEY,
    Authorization: "Bearer " + SUPABASE_KEY,
    "Content-Type": "application/json",
    ...options.headers
  };

  const response = await fetch(url, {
    ...options,
    headers
  });

  const text = await response.text();
  let data = null;

  try {
    data = text ? JSON.parse(text) : null;
  } catch {
    data = text;
  }

  if (!response.ok) {
    const message =
      data && typeof data === "object"
        ? data.message || data.error || JSON.stringify(data)
        : data || "HTTP " + response.status;

    throw new Error(message);
  }

  return data;
}

async function api(path = "", options = {}) {
  return request(API + path, options);
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, (char) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function setStatus(message, isError = false) {
  const el = $("status");
  el.textContent = message;
  el.style.color = isError ? "#ff8b9b" : "";
}

function fromRow(row) {
  return {
    id: row.id,
    title: row.title || "無題",
    author: row.author || "名無し",
    genre: row.genre || "",
    melody: row.melody || "",
    chord1: row.chord1 || "",
    chord2: row.chord2 || "",
    created_at: row.created_at || ""
  };
}

async function loadPosts() {
  setStatus("投稿を読み込み中…");

  try {
    const rows = await api(
      "?select=id,title,author,genre,melody,chord1,chord2,created_at&order=created_at.desc"
    );

    posts = (Array.isArray(rows) ? rows : []).map(fromRow);
    render();
    setStatus("投稿 " + posts.length + " 件");
  } catch (error) {
    setStatus("読み込み失敗：" + error.message, true);
    $("posts").innerHTML =
      '<p class="empty">投稿を読み込めませんでした。Supabaseの設定を確認してください。</p>';
  }
}

function render() {
  const keyword = ($("search").value || "").trim().toLowerCase();
  const genre = $("filterGenre").value;

  const filtered = posts.filter((post) => {
    const text = [
      post.title,
      post.author,
      post.genre,
      post.melody,
      post.chord1,
      post.chord2
    ].join(" ").toLowerCase();

    return (!keyword || text.includes(keyword)) &&
      (!genre || post.genre === genre);
  });

  if (filtered.length === 0) {
    $("posts").innerHTML =
      '<p class="empty">投稿がありません。</p>';
    return;
  }

  $("posts").innerHTML = filtered.map((post) => {
    const date = post.created_at
      ? new Date(post.created_at).toLocaleString("ja-JP")
      : "";

    const adminButton = adminPasswordForSession
      ? `<button type="button" class="danger" onclick="adminDeletePost(${Number(post.id)})">管理者削除</button>`
      : "";

    return `
      <article class="post">
        <div class="post-head">
          <div>
            <h3>${esc(post.title)}</h3>
            <div class="meta">
              ${esc(post.author)} ・ ${esc(post.genre)} ・ ${esc(date)}
              ・ ID: ${Number(post.id)}
            </div>
          </div>
        </div>

        <div class="mml-block">
          <strong>主旋律</strong>
          <pre>${esc(post.melody)}</pre>
          <div class="actions">
            <button type="button" onclick="copyPart(${Number(post.id)}, 'melody')">主旋律をコピー</button>
          </div>
        </div>

        ${post.chord1 ? `
          <div class="mml-block">
            <strong>伴奏1</strong>
            <pre>${esc(post.chord1)}</pre>
            <div class="actions">
              <button type="button" onclick="copyPart(${Number(post.id)}, 'chord1')">伴奏1をコピー</button>
            </div>
          </div>` : ""}

        ${post.chord2 ? `
          <div class="mml-block">
            <strong>伴奏2</strong>
            <pre>${esc(post.chord2)}</pre>
            <div class="actions">
              <button type="button" onclick="copyPart(${Number(post.id)}, 'chord2')">伴奏2をコピー</button>
            </div>
          </div>` : ""}

        <div class="actions">
          <button type="button" onclick="copyAll(${Number(post.id)})">全部コピー</button>
          <button type="button" class="danger" onclick="deletePost(${Number(post.id)})">投稿者として削除</button>
          ${adminButton}
        </div>
      </article>
    `;
  }).join("");
}

async function sha256Hex(value) {
  const bytes = new TextEncoder().encode(value);
  const hash = await crypto.subtle.digest("SHA-256", bytes);

  return Array.from(new Uint8Array(hash))
    .map((byte) => byte.toString(16).padStart(2, "0"))
    .join("");
}

async function copyText(value) {
  try {
    await navigator.clipboard.writeText(value);
    alert("コピーしました！");
  } catch {
    prompt("下の文字列をコピーしてください", value);
  }
}

function findPost(id) {
  return posts.find((post) => Number(post.id) === Number(id));
}

window.copyPart = async function(id, part) {
  const post = findPost(id);
  if (!post) return;

  await copyText(post[part] || "");
};

window.copyTitle = async function(id) {
  const post = findPost(id);
  if (!post) return;

  await copyText(post.title || "");
};

window.copyAll = async function(id) {
  const post = findPost(id);
  if (!post) return;

  const content = [
    "タイトル: " + post.title,
    "作者: " + post.author,
    "ジャンル: " + post.genre,
    "",
    "[主旋律]",
    post.melody,
    "",
    "[伴奏1]",
    post.chord1,
    "",
    "[伴奏2]",
    post.chord2
  ].join("\n");

  await copyText(content);
};

window.deletePost = async function(id) {
  const post = findPost(id);
  if (!post) return;

  const token = prompt(
    "この投稿を登録したときの削除パスワードを入力してください。"
  );

  if (token === null || token === "") return;

  if (!confirm("「" + post.title + "」を削除しますか？")) return;

  try {
    const tokenHash = await sha256Hex(token);

    await request(RPC, {
      method: "POST",
      body: JSON.stringify({
        p_id: Number(id),
        p_token_hash: tokenHash
      })
    });

    alert("削除しました。");
    await loadPosts();
  } catch (error) {
    alert("削除できませんでした。\n" + error.message);
  }
};

$("postForm").addEventListener("submit", async (event) => {
  event.preventDefault();

  const title = $("title").value.trim();
  const author = $("author").value.trim() || "名無し";
  const genre = $("genre").value;
  const melody = $("melody").value.trim();
  const chord1 = $("chord1").value.trim();
  const chord2 = $("chord2").value.trim();
  const deleteToken = $("deleteToken").value;

  if (!title || !melody || !deleteToken) {
    alert("タイトル・主旋律・削除パスワードを入力してください。");
    return;
  }

  const submitButton = event.submitter;
  if (submitButton) submitButton.disabled = true;

  setStatus("投稿中…");

  try {
    const deleteTokenHash = await sha256Hex(deleteToken);

    await api("", {
      method: "POST",
      headers: {
        Prefer: "return=minimal"
      },
      body: JSON.stringify({
        title,
        author,
        genre,
        melody,
        chord1,
        chord2,
        delete_token_hash: deleteTokenHash
      })
    });

    $("postForm").reset();
    alert("投稿しました！");
    await loadPosts();
  } catch (error) {
    setStatus("投稿できませんでした：" + error.message, true);
    alert(
      "投稿できませんでした。\n" +
      error.message +
      "\n\nSupabaseのテーブル設定・権限を確認してください。"
    );
  } finally {
    if (submitButton) submitButton.disabled = false;
  }
});

$("adminLoginForm").addEventListener("submit", async (event) => {
  event.preventDefault();

  const password = $("adminPassword").value;
  if (!password) {
    alert("管理者パスワードを入力してください。");
    return;
  }

  $("adminLoginButton").disabled = true;
  $("adminMessage").textContent = "確認中…";

  try {
    const result = await request(ADMIN_API, {
      method: "POST",
      body: JSON.stringify({
        action: "login",
        password
      })
    });

    if (!result || result.success !== true) {
      throw new Error(result?.error || "ログインに失敗しました。");
    }

    // パスワードはこのページを開いている間だけメモリに保持
    adminPasswordForSession = password;
    $("adminPassword").value = "";
    $("adminLogoutButton").hidden = false;
    $("adminLoginButton").hidden = true;
    $("adminState").textContent = "管理者ログイン中";
    $("adminMessage").textContent = "管理者としてログインしました。";

    render();
  } catch (error) {
    adminPasswordForSession = null;
    $("adminMessage").textContent =
      "ログイン失敗：" + error.message;
  } finally {
    $("adminLoginButton").disabled = false;
  }
});

$("adminLogoutButton").addEventListener("click", () => {
  adminPasswordForSession = null;
  $("adminLogoutButton").hidden = true;
  $("adminLoginButton").hidden = false;
  $("adminState").textContent = "ログアウト中";
  $("adminMessage").textContent = "ログアウトしました。";
  render();
});

window.adminDeletePost = async function(id) {
  if (!adminPasswordForSession) {
    alert("先に管理者ログインしてください。");
    return;
  }

  const post = findPost(id);
  if (!post) return;

  if (!confirm(
    "管理者権限で「" + post.title +
    "」を削除しますか？\nこの操作は取り消せません。"
  )) {
    return;
  }

  try {
    const result = await request(ADMIN_API, {
      method: "POST",
      body: JSON.stringify({
        action: "delete",
        password: adminPasswordForSession,
        id: Number(id)
      })
    });

    if (!result || result.success !== true) {
      throw new Error(
        result?.error || "投稿が見つからないか、削除できませんでした。"
      );
    }

    alert("管理者権限で削除しました。");
    await loadPosts();
  } catch (error) {
    alert(
      "管理者削除に失敗しました。\n" +
      error.message +
      "\n\nEdge Functionの設定・デプロイを確認してください。"
    );
  }
};

$("search").addEventListener("input", render);
$("filterGenre").addEventListener("change", render);

loadPosts();
</script>
</body>
</html>
